const slides = [
  {
    title: "What is Quantum Computing?",
    html: `
      <p>Classical computers use <strong>bits</strong> (0 or 1). Quantum computers use <strong>qubits</strong> — they can be 0, 1, or <strong>both at once</strong> (superposition).</p>
      <ul>
        <li>Multiple qubits can be <strong>entangled</strong> — measuring one instantly tells us about another</li>
        <li>Quantum algorithms can solve certain problems <strong>exponentially faster</strong> than classical ones</li>
      </ul>
      <div class="highlight-box">
        <strong>PennyLane</strong> is a Python library for quantum computing, developed by Xanadu. It lets us build, simulate, and test quantum circuits using familiar Python syntax.
      </div>
    `
  },
  {
    title: "Getting Started with PennyLane",
    html: `
      <p>Every quantum circuit in PennyLane is a <strong>Python function</strong> decorated with <code>@qp.qnode(dev)</code>:</p>
      <div class="code-block">
<span class="kw">import</span> pennylane <span class="kw">as</span> qp<br>
<span class="kw">import</span> numpy <span class="kw">as</span> np<br><br>
<span class="cmt">// Create a device (simulator) with 2 qubits</span><br>
dev = qp.<span class="fn">device</span>(<span class="str">"default.qubit"</span>, wires=<span class="num">2</span>)<br><br>
<span class="cmt">// Define a quantum circuit</span><br>
<span class="fn">@qp.qnode</span>(dev)<br>
<span class="kw">def</span> <span class="fn">circuit</span>():<br>
&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">PauliX</span>(wires=<span class="num">0</span>)&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Apply X gate to qubit 0</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> qp.<span class="fn">state</span>()&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Return the quantum state</span>
      </div>
      <p>No separate classical registers needed — just return measurements directly.</p>
      <p style="font-size:12px;color:#888;"><em>Source: A00</em></p>
    `
  },
  {
    title: "Essential Quantum Gates",
    html: `
      <p>These gates are the <strong>building blocks</strong> of all quantum algorithms.</p>
      <table>
        <tr><th>Gate</th><th>Name</th><th>What it does</th></tr>
        <tr><td><code>PauliX(wires=i)</code></td><td>NOT gate</td><td>Flips |0⟩ to |1⟩ and vice versa</td></tr>
        <tr><td><code>PauliZ(wires=i)</code></td><td>Phase flip</td><td>Flips the phase: |1⟩ → −|1⟩</td></tr>
        <tr><td><code>Hadamard(wires=i)</code></td><td>Superposition</td><td>Creates equal superposition: |0⟩ → (|0⟩+|1⟩)/√2</td></tr>
        <tr><td><code>CNOT(wires=[c,t])</code></td><td>Controlled-NOT</td><td>Flips target qubit if control is |1⟩</td></tr>
        <tr><td><code>CZ(wires=[c,t])</code></td><td>Controlled-Z</td><td>Applies Z to target if control is |1⟩</td></tr>
        <tr><td><code>SWAP(wires=[a,b])</code></td><td>Swap</td><td>Swaps two qubits</td></tr>
        <tr><td><code>Toffoli(wires=[a,b,c])</code></td><td>CCX</td><td>Flips target only if both controls are |1⟩</td></tr>
      </table>
      <p style="font-size:12px;color:#888;"><em>Source: A00</em></p>
    `
  },
  {
    title: "Complex Phase Gates",
    html: `
      <p>Beyond the basics, <strong>phase gates</strong> rotate the qubit's phase without changing measurement probabilities directly:</p>
      <table>
        <tr><th>Gate</th><th>Matrix</th><th>Phase Rotation</th></tr>
        <tr>
          <td><code>PauliY(wires=i)</code></td>
          <td><span class="matrix"><span class="matrix-col"><span>0</span><span>i</span></span><span class="matrix-col"><span>−i</span><span>0</span></span></span></td>
          <td>π rotation on Bloch sphere</td>
        </tr>
        <tr>
          <td><code>S(wires=i)</code></td>
          <td><span class="matrix"><span class="matrix-col"><span>1</span><span>0</span></span><span class="matrix-col"><span>0</span><span>i</span></span></span></td>
          <td>π/2 phase — S = √Z</td>
        </tr>
        <tr>
          <td><code>T(wires=i)</code></td>
          <td><span class="matrix"><span class="matrix-col"><span>1</span><span>0</span></span><span class="matrix-col"><span>0</span><span>e<sup>iπ/4</sup></span></span></span></td>
          <td>π/4 phase — T = √S</td>
        </tr>
        <tr>
          <td><code>Sdg(wires=i)</code></td>
          <td><span class="matrix"><span class="matrix-col"><span>1</span><span>0</span></span><span class="matrix-col"><span>0</span><span>−i</span></span></span></td>
          <td>S† (inverse of S)</td>
        </tr>
        <tr>
          <td><code>Tdg(wires=i)</code></td>
          <td><span class="matrix"><span class="matrix-col"><span>1</span><span>0</span></span><span class="matrix-col"><span>0</span><span>e<sup>−iπ/4</sup></span></span></span></td>
          <td>T† (inverse of T)</td>
        </tr>
      </table>
      <div class="highlight-box">
        <strong>Key insight:</strong> Phase gates have no visible effect when applied alone — but when sandwiched between Hadamards, they produce <strong>different measurement outcomes</strong>. This is how phases become "visible."
      </div>
      <p style="font-size:12px;color:#888;"><em>Source: C04</em></p>
    `
  },
  {
    title: "Multi-Qubit Operations",
    html: `
      <p>Real quantum algorithms need <strong>controlled gates</strong> acting on multiple qubits:</p>
      <table>
        <tr><th>Gate</th><th>Wires</th><th>Description</th></tr>
        <tr><td><code>CY([c,t])</code></td><td>Control + Target</td><td>Controlled-Y</td></tr>
        <tr><td><code>CH([c,t])</code></td><td>Control + Target</td><td>Controlled-Hadamard</td></tr>
        <tr><td><code>CRZ(λ,[c,t])</code></td><td>Control + Target</td><td>Controlled Z-rotation by angle λ</td></tr>
        <tr><td><code>ControlledPhaseShift(λ,[c,t])</code></td><td>Control + Target</td><td>Adds phase e^(iλ) when both qubits are |1⟩</td></tr>
        <tr><td><code>ctrl(U, control=c)</code></td><td>Any</td><td>Makes ANY gate controlled</td></tr>
      </table>
      <p><strong>Three-qubit gates:</strong> Toffoli (CCX) — two controls, one target; Fredkin (CSWAP) — control + two targets.</p>
      <div class="highlight-box">
        <strong>Important:</strong> <code>CRZ</code> and <code>ControlledPhaseShift</code> are <strong>NOT equivalent</strong> — they differ by a phase on the control qubit. This matters in algorithms!
      </div>
      <p style="font-size:12px;color:#888;"><em>Source: C09</em></p>
    `
  },
  {
    title: "The Discrete Fourier Transform (DFT)",
    html: `
      <p>Before understanding QFT, we need the classical <strong>DFT</strong>. Given N complex numbers x₀, x₁, ..., x_{N−1}:</p>
      <div class="math-block" style="font-size:20px; letter-spacing:1px;">
        y<sub>k</sub> = (1/√N) · Σ<sub>j=0</sub><sup>N−1</sup> e<sup>−2πijk/N</sup> · x<sub>j</sub>
      </div>
      <p><strong>What does it do?</strong> Converts a signal from the <strong>time domain</strong> to the <strong>frequency domain</strong>.</p>
      <div class="highlight-box">
        <strong>Key property:</strong> If the input is <strong>periodic</strong> with period r, the DFT output has <strong>peaks at multiples of N/r</strong>.
      </div>
      <p style="font-size:13px;background:rgba(0,0,0,0.3);padding:10px 14px;border-radius:8px;">
        <strong>Example:</strong> Input [1,0,0,0,1,0,0,0,1,0] (period r=5, N=10)<br>
        → Output peaks at positions 0, 2, 4, 6, 8 (multiples of 10/5 = 2)
      </p>
      <p>This "finding the period" property is the foundation of <strong>Shor's Algorithm</strong>.</p>
      <p style="font-size:12px;color:#888;"><em>Source: D01</em></p>
    `
  },
  {
    title: "The Quantum Fourier Transform (QFT)",
    html: `
      <p>The QFT operates on <strong>quantum state amplitudes</strong>. For a basis state |j⟩:</p>
      <div class="math-block" style="font-size:20px; letter-spacing:1px;">
        QFT |j⟩ = (1/√N) · Σ<sub>k=0</sub><sup>N−1</sup> e<sup>2πijk/N</sup> |k⟩
      </div>
      <div class="highlight-box">
        <strong>Surprising fact:</strong> The 1-qubit QFT is just the <strong>Hadamard gate</strong>!
      </div>
      <h3>QFT Circuit (n qubits)</h3>
      <div class="code-block">
<span class="kw">def</span> <span class="fn">qft</span>(n, qubits):<br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">Hadamard</span>(wires=qubits[i])<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j <span class="kw">in</span> <span class="fn">range</span>(i+<span class="num">1</span>, n):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">ControlledPhaseShift</span>(<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;np.pi * <span class="num">2</span> / <span class="num">2</span>**(j-i+<span class="num">1</span>),<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;wires=[qubits[j], qubits[i]]<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)<br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n//<span class="num">2</span>):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">SWAP</span>(wires=[qubits[i], qubits[n-<span class="num">1</span>-i]])
      </div>
      <p><strong>Speed:</strong> Classical FFT = O(n·2ⁿ) vs Quantum QFT = O(n²) — <strong>exponential speedup!</strong></p>
      <p style="font-size:12px;color:#888;"><em>Source: D02</em></p>
    `
  },
  {
    title: "Inverse QFT",
    html: `
      <p>The inverse QFT (QFT†) reverses the transformation:</p>
      <div class="code-block">
<span class="kw">def</span> <span class="fn">iqft</span>(n, qubits):<br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Same as QFT but in REVERSE order</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// and with NEGATIVE phase angles</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n//<span class="num">2</span>):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">SWAP</span>(wires=[qubits[i], qubits[n-<span class="num">1</span>-i]])<br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n-<span class="num">1</span>, <span class="num">-1</span>, <span class="num">-1</span>):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j <span class="kw">in</span> <span class="fn">range</span>(n-<span class="num">1</span>, i, <span class="num">-1</span>):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">ControlledPhaseShift</span>(<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-np.pi * <span class="num">2</span> / <span class="num">2</span>**(j-i+<span class="num">1</span>),<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;wires=[qubits[j], qubits[i]]<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">Hadamard</span>(wires=qubits[i])
      </div>
      <div class="highlight-box">
        <strong>Verification:</strong> QFT · QFT† = Identity (applying both gives back the original state)
      </div>
      <p style="font-size:12px;color:#888;"><em>Source: D02</em></p>
    `

  {
    title: "Phase Estimation — The Problem",
    html: `
      <p><strong>Problem:</strong> Given a unitary operator U and its eigenstate |ψ⟩, estimate the phase φ in:</p>
      <div class="math-block" style="font-size:20px; letter-spacing:1px;">
        U |ψ⟩ = e<sup>2πiφ</sup> |ψ⟩
      </div>
      <p><strong>Why does this matter?</strong> Phase estimation is the <strong>core subroutine</strong> of Shor's Algorithm. If we can estimate phases of U = e^(2πi·a/N), we can find the period and factor large numbers.</p>
      <h3>Example: The X gate</h3>
      <p>The X gate has eigenstates:</p>
      <ul>
        <li><strong>|+⟩</strong> with eigenvalue +1 = e^(2πi·0) → phase φ = 0</li>
        <li><strong>|−⟩</strong> with eigenvalue −1 = e^(2πi·½) → phase φ = 1/2</li>
      </ul>
      <p style="font-size:12px;color:#888;"><em>Source: D03</em></p>
    `
  },
  {
    title: "Phase Kickback — The Key Mechanism",
    html: `
      <p>The trick that makes phase estimation work is <strong>phase kickback</strong>:</p>
      <p>When we apply a controlled-U to a control qubit in superposition and the target is an eigenstate:</p>
      <div class="math-block" style="font-size:18px; letter-spacing:1px; line-height:2;">
        CU · (|0⟩ + |1⟩)/√2 ⊗ |ψ⟩<br>
        &nbsp;&nbsp;= (|0⟩ + e<sup>2πiφ</sup>|1⟩)/√2 ⊗ |ψ⟩
      </div>
      <div class="highlight-box">
        The eigenvalue phase <strong>"kicks back"</strong> onto the control qubit! The target eigenstate is unchanged.
      </div>
      <p>By using <strong>CU^(2^j)</strong> for different powers j, we encode different bits of φ into different control qubits.</p>
      <p style="font-size:12px;color:#888;"><em>Source: D03</em></p>
    `
  },
  {
    title: "The Phase Estimation Algorithm",
    html: `
      <h3>Setup</h3>
      <ul>
        <li><strong>Register 1</strong> (t qubits): the "counting" register, initialized to |0...0⟩</li>
        <li><strong>Register 2</strong>: stores the eigenstate |ψ⟩</li>
      </ul>
      <h3>Steps</h3>
      <div class="code-block">
Step 1: Apply Hadamard to all t control qubits<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ creates equal superposition<br><br>
Step 2: Apply CU^(2^j) gates<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ CU^1 on qubit t-1<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ CU^2 on qubit t-2<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ ...<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ CU^(2^(t-1)) on qubit 0<br><br>
Step 3: Apply Inverse QFT to the t control qubits<br><br>
Step 4: Measure the t control qubits<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ result is the binary representation of φ
      </div>
      <p><strong>Precision:</strong> t = n + ⌈log(2 + 1/2ε)⌉ qubits gives n-bit precision with probability ≥ 1−ε.</p>
      <p style="font-size:12px;color:#888;"><em>Source: D03</em></p>
    `
  },
  {
    title: "PennyLane Implementation",

&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Step 1: Hadamard on control qubits</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> q <span class="kw">in</span> control:<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">Hadamard</span>(wires=q)<br><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Step 2: Controlled-U^(2^j) gates</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(t):<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CU_func(control[t-i-<span class="num">1</span>], target, <span class="num">2</span>**i)<br><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="cmt">// Step 3: Inverse QFT</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">iqft</span>(t, control)<br><br>
<span class="fn">@qp.qnode</span>(dev)<br>
<span class="kw">def</span> <span class="fn">circuit</span>():<br>
&nbsp;&nbsp;&nbsp;&nbsp;control = <span class="fn">list</span>(<span class="fn">range</span>(t))<br>
&nbsp;&nbsp;&nbsp;&nbsp;target = <span class="fn">list</span>(<span class="fn">range</span>(t, t+n))<br>
&nbsp;&nbsp;&nbsp;&nbsp;qp.<span class="fn">PauliX</span>(wires=target[<span class="num">0</span>])&nbsp;&nbsp;<span class="cmt">// Prepare eigenstate</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">qpe</span>(t, control, target, CU_func)<br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> qp.<span class="fn">counts</span>()
      </div>

let current = 0;

function render() {
  const s = slides[current];
  document.getElementById('slideContent').innerHTML = '<h2>' + s.title + '</h2>' + s.html;
  document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });
}

function changeSlide(dir) {
  const next = current + dir;
  if (next >= 0 && next < slides.length) {
    current = next;
    render();
  }
}

function goTo(i) {
  current = i;
  render();
}

// Build dots
const dotsContainer = document.getElementById('dots');
for (let i = 0; i < slides.length; i++) {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.onclick = () => goTo(i);
  dotsContainer.appendChild(dot);
}

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') changeSlide(1);
  if (e.key === 'ArrowLeft') changeSlide(-1);
});

render();
</script>
